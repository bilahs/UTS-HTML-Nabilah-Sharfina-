<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Your Think</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
   <main class="auth-container">
        <section class="auth-left">
            <img src="gambar menulis jpg.jpg" class="auth-image" alt="Menulis">
            <div class="image-overlay"> </div>
            <div class="left-content">
                <span class="brand-tag">Your Think.</span>
                <h1>Tempat terbaik untuk menuangkan ide dan gagasanmu.</h1>
                <p>Bergabunglah dengan para pemikir dan penulis independen lainnya.</p>
            </div>
        </section>

<section class="auth-right">
            <div class="form-wrapper">
                <header class="form-header">
                    <h2>Selamat Datang Kembali</h2>
                    <p>Silakan masuk ke akun Your Think kamu.</p>
                </header>

      <button type="button" class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.16 21.37 7.24 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.25c-.24-.72-.38-1.49-.38-2.25s.14-1.53.38-2.25V6.6H1.2C.43 8.15 0 9.89 0 12s.43 3.85 1.2 5.4l4.08-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.16 2.63 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
                    </svg>
                    Masuk dengan Google
                </button>

                <div class="divider">
                    <span>atau dengan email</span>
                </div>
                
     <form class="login-form" action="#" method="POST">
                    <div class="input-group">
                        <label for="email">Email atau Username</label>
                        <input type="text" id="email" placeholder="nama@domain.com" required>
                    </div>

                    <div class="input-group">
                        <div class="label-flex">
                            <label for="password">Kata Sandi</label>
                            <a href="#" class="forgot-link">Lupa kata sandi?</a>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-submit">Masuk</button>
                </form>

                <footer class="form-footer">
                    <p>Belum punya akun? <a href="#">Daftar gratis</a></p>
                </footer>
            </div>
        </section>
    </main>
   
</body>
</html>
